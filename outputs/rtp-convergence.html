<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUEL.COM PLINKO RTP CONVERGENCE — 27 CONFIGS x 1M ROUNDS EACH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; padding: 24px; }
  .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 12px; border: 1px solid #e0e0e0; padding: 32px; }
  h1 { text-align: center; font-size: 16px; font-weight: 600; color: #333; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .sub { text-align: center; font-size: 12px; color: #777; margin-bottom: 16px; }
  svg { display: block; width: 100%; height: auto; }
  .legend { text-align: center; margin-top: 12px; font-size: 13px; color: #666; }
  .legend span { margin: 0 12px; }
  .legend .dot { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
  .final-box { display: inline-block; border: 2px solid #4caf50; border-radius: 8px; padding: 10px 20px; margin-top: 20px; }
  .final-box .label { font-size: 13px; color: #666; }
  .final-box .value { font-size: 22px; font-weight: 700; color: #2e7d32; }
  .final-box .check { color: #4caf50; font-size: 18px; }
</style>
</head>
<body>
<div class="container">
  <h1>Duel.com Plinko RTP Convergence — 27 configs &times; 1M rounds each</h1>
  <div class="sub">Running mean simulated RTP over the pooled run, with its standard error. SE = &sigma;/&radic;n, not standard deviation.</div>
  <svg viewBox="0 0 1000 470" role="img" aria-label="Mean simulated RTP converging on the theoretical RTP as rounds accumulate">
    <rect x="70" y="40" width="902" height="372" fill="#fff" stroke="#ddd"/>
    <line x1="70" y1="412.0" x2="972" y2="412.0" stroke="#eee" stroke-width="1"/><text x="62" y="416.0" text-anchor="end" font-size="11" fill="#666">94.17%</text>
    <line x1="70" y1="319.0" x2="972" y2="319.0" stroke="#eee" stroke-width="1"/><text x="62" y="323.0" text-anchor="end" font-size="11" fill="#666">96.64%</text>
    <line x1="70" y1="226.0" x2="972" y2="226.0" stroke="#eee" stroke-width="1"/><text x="62" y="230.0" text-anchor="end" font-size="11" fill="#666">99.12%</text>
    <line x1="70" y1="133.0" x2="972" y2="133.0" stroke="#eee" stroke-width="1"/><text x="62" y="137.0" text-anchor="end" font-size="11" fill="#666">101.60%</text>
    <line x1="70" y1="40.0" x2="972" y2="40.0" stroke="#eee" stroke-width="1"/><text x="62" y="44.0" text-anchor="end" font-size="11" fill="#666">104.07%</text>
    <line x1="70.0" y1="40" x2="70.0" y2="412" stroke="#f4f4f4" stroke-width="1"/><text x="70.0" y="432.0" text-anchor="middle" font-size="11" fill="#666">1K</text>
    <line x1="220.3" y1="40" x2="220.3" y2="412" stroke="#f4f4f4" stroke-width="1"/><text x="220.3" y="432.0" text-anchor="middle" font-size="11" fill="#666">5K</text>
    <line x1="521.0" y1="40" x2="521.0" y2="412" stroke="#f4f4f4" stroke-width="1"/><text x="521.0" y="432.0" text-anchor="middle" font-size="11" fill="#666">50K</text>
    <line x1="671.3" y1="40" x2="671.3" y2="412" stroke="#f4f4f4" stroke-width="1"/><text x="671.3" y="432.0" text-anchor="middle" font-size="11" fill="#666">100K</text>
    <line x1="972.0" y1="40" x2="972.0" y2="412" stroke="#f4f4f4" stroke-width="1"/><text x="972.0" y="432.0" text-anchor="middle" font-size="11" fill="#666">1M</text>
    <polygon points="70.0,175.6 220.3,99.7 370.7,76.0 521.0,143.1 671.3,168.5 821.7,182.8 972.0,192.7 972.0,199.4 821.7,198.6 671.3,198.9 521.0,195.2 370.7,208.6 220.3,260.5 70.0,376.0" fill="rgba(229,115,115,0.10)" stroke="none"/>
    <polyline points="70.0,225.7 220.3,139.9 370.7,109.2 521.0,156.1 671.3,176.1 821.7,186.8 972.0,194.4" fill="none" stroke="rgba(229,115,115,0.45)" stroke-width="1"/>
    <polyline points="70.0,325.9 220.3,220.3 370.7,175.5 521.0,182.2 671.3,191.3 821.7,194.7 972.0,197.7" fill="none" stroke="rgba(229,115,115,0.45)" stroke-width="1"/>
    <line x1="70" y1="196.7" x2="972" y2="196.7" stroke="#e57373" stroke-width="2" stroke-dasharray="8 4"/>
    <polyline points="70.0,275.8 220.3,180.1 370.7,142.3 521.0,169.2 671.3,183.7 821.7,190.7 972.0,196.1" fill="none" stroke="#1565c0" stroke-width="2.5"/>
    <circle cx="70.0" cy="275.8" r="2.5" fill="#1565c0"/>
    <circle cx="220.3" cy="180.1" r="2.5" fill="#1565c0"/>
    <circle cx="370.7" cy="142.3" r="2.5" fill="#1565c0"/>
    <circle cx="521.0" cy="169.2" r="2.5" fill="#1565c0"/>
    <circle cx="671.3" cy="183.7" r="2.5" fill="#1565c0"/>
    <circle cx="821.7" cy="190.7" r="2.5" fill="#1565c0"/>
    <circle cx="972.0" cy="196.1" r="2.5" fill="#1565c0"/>
    <text x="521.0" y="456.0" text-anchor="middle" font-size="12" fill="#444">Rounds per config</text>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#1565c0"></span>Mean RTP</span>
    <span><span class="dot" style="background:rgba(229,115,115,0.45)"></span>&plusmn;1 SE</span>
    <span><span class="dot" style="background:rgba(229,115,115,0.25)"></span>&plusmn;2 SE band</span>
    <span><span class="dot" style="background:#e57373"></span>Theoretical (99.9000%)</span>
  </div>
  <div style="text-align:right; margin-top:8px;">
    <div class="final-box">
      <span class="label">Final Mean RTP:</span>
      <span class="value">99.917%</span>
      <span class="check">&#10003;</span>
    </div>
  </div>
</div>
</body>
</html>
